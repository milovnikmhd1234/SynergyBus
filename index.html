<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Synergy OCC - Mobilní Pokladna</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@700&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            touch-action: manipulation;
            background-color: #000;
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        
        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .pulse-active { animation: pulse-green 2s infinite; }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .scanline {
            height: 10px;
            background: linear-gradient(to bottom, rgba(16, 185, 129, 0) 0%, rgba(16, 185, 129, 0.1) 50%, rgba(16, 185, 129, 0) 100%);
            animation: scanline 4s linear infinite;
        }
    </style>
</head>
<body class="text-white overflow-hidden select-none">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;
        const { motion, AnimatePresence } = window.Motion;

        const TICKETS = [
            { id: '1', name: 'Základní 30 min', price: 30, category: 'base', color: 'bg-emerald-600' },
            { id: '2', name: 'Základní 60 min', price: 40, category: 'base', color: 'bg-emerald-600' },
            { id: '3', name: 'Základní 90 min', price: 50, category: 'base', color: 'bg-emerald-600' },
            { id: '4', name: 'Zlevněná 30 min', price: 15, category: 'discount', color: 'bg-amber-600' },
            { id: '5', name: 'Zlevněná 60 min', price: 20, category: 'discount', color: 'bg-amber-600' },
            { id: '6', name: 'Zlevněná 90 min', price: 25, category: 'discount', color: 'bg-amber-600' },
            { id: '7', name: 'Senior / ZTP', price: 0, category: 'discount', color: 'bg-amber-600' },
            { id: '8', name: 'Zavazadlo', price: 20, category: 'special', color: 'bg-sky-600' },
            { id: '9', name: 'Pes', price: 20, category: 'special', color: 'bg-sky-600' },
            { id: '10', name: 'Přestupní denní', price: 120, category: 'base', color: 'bg-indigo-600' },
        ];

        function App() {
            const [isPoweredOn, setIsPoweredOn] = useState(false);
            const [isBooting, setIsBooting] = useState(false);
            const [driver, setDriver] = useState(() => {
                const saved = localStorage.getItem('synergy_driver');
                return saved ? JSON.parse(saved) : null;
            });
            const [config, setConfig] = useState(() => {
                const saved = localStorage.getItem('synergy_config');
                return saved ? JSON.parse(saved) : {
                    lineNumber: '12',
                    destination: 'Technologický park',
                    stops: ['Hlavní nádraží', 'Náměstí Svobody (z)', 'Zelný trh', 'Česká', 'Technologický park']
                };
            });

            const [cart, setCart] = useState([]);
            const [currentTime, setCurrentTime] = useState(new Date());
            const [currentStopIndex, setCurrentStopIndex] = useState(0);
            const [isPaying, setIsPaying] = useState(false);
            const [paymentSuccess, setPaymentSuccess] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [showMobileCart, setShowMobileCart] = useState(false);
            const [tempConfig, setTempConfig] = useState(config);

            const playSound = (freq, duration, type = 'sine') => {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, ctx.currentTime);
                    gain.gain.setValueAtTime(0.05, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(); osc.stop(ctx.currentTime + duration);
                } catch (e) {}
            };

            const playPaymentSound = () => playSound(880, 0.2);
            const playBeepSound = () => {
                playSound(600, 0.4, 'square'); // Výstražný odjezdový tón
            };

            const playAnnouncement = useCallback(() => {
                const stops = config.stops;
                const current = stops[currentStopIndex] || '';
                const next = stops[(currentStopIndex + 1) % stops.length] || '';
                const isReq = (s) => s.toLowerCase().includes('(z)') || s.toLowerCase().includes('na znamení');
                
                let text = `Zastávka: ${current.replace(/\(z\)/gi, '')}.`;
                if (isReq(current)) text += " Tato zastávka je na znamení.";
                text += ` Příští zastávka: ${next.replace(/\(z\)/gi, '')}.`;
                if (isReq(next)) text += " Příští zastávka bude na znamení.";
                
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'cs-CZ';
                msg.pitch = 0.85; msg.rate = 0.9;
                const voices = window.speechSynthesis.getVoices();
                const v = voices.find(v => v.lang.includes('cs') && (v.name.toLowerCase().includes('jakub') || v.name.toLowerCase().includes('matej') || v.name.toLowerCase().includes('male')));
                if (v) msg.voice = v;
                window.speechSynthesis.speak(msg);
            }, [config.stops, currentStopIndex]);

            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                localStorage.setItem('synergy_config', JSON.stringify(config));
                if (window.lucide) lucide.createIcons();
            }, [config, showSettings, showMobileCart, isPoweredOn, driver]);

            const handlePowerOn = () => {
                setIsBooting(true);
                setTimeout(() => {
                    setIsBooting(false);
                    setIsPoweredOn(true);
                }, 2500);
            };

            const handleDriverLogin = (name) => {
                if(!name) return;
                const d = { name, loginTime: new Date().toLocaleTimeString() };
                setDriver(d);
                localStorage.setItem('synergy_driver', JSON.stringify(d));
            };

            const nextStop = () => {
                playBeepSound();
                setCurrentStopIndex((currentStopIndex + 1) % config.stops.length);
            };

            const addToCart = (ticket) => {
                setCart(prev => {
                    const existing = prev.find(item => item.id === ticket.id);
                    if (existing) return prev.map(item => item.id === ticket.id ? { ...item, quantity: item.quantity + 1 } : item);
                    return [...prev, { ...ticket, quantity: 1 }];
                });
            };

            const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

            const handlePayment = () => {
                setIsPaying(true);
                setTimeout(() => {
                    setIsPaying(false);
                    setPaymentSuccess(true);
                    playPaymentSound();
                    setTimeout(() => {
                        setPaymentSuccess(false);
                        setCart([]);
                        setShowMobileCart(false);
                    }, 2000);
                }, 1200);
            };

            if (!isPoweredOn && !isBooting) {
                return (
                    <div className="fixed inset-0 bg-black flex flex-col items-center justify-center cursor-pointer" onClick={handlePowerOn}>
                        <div className="w-20 h-20 rounded-full border-2 border-gray-900 flex items-center justify-center text-gray-900 transition-all hover:border-emerald-500/20 hover:text-emerald-500/20">
                             <i data-lucide="power" style={{width: 32, height: 32}}></i>
                        </div>
                        <p className="mt-6 text-[8px] font-black uppercase tracking-[0.4em] text-gray-800">Boot Synergy System</p>
                    </div>
                );
            }

            if (isBooting) {
                return (
                    <div className="fixed inset-0 bg-[#0a0a0a] flex flex-col p-8 font-mono text-emerald-500 text-[10px]">
                        <div className="absolute inset-0 scanline opacity-20"></div>
                        <div className="space-y-1">
                            <p>Loading KERNEL...</p>
                            <p>Drivers: Keyboard, Display, Printer, Sound [LOADED]</p>
                            <p>Network: OFFLINE MODE</p>
                            <p>Starting UI...</p>
                            <div className="mt-4 h-0.5 bg-emerald-900 w-32 relative overflow-hidden">
                                <motion.div className="absolute inset-y-0 bg-emerald-500" initial={{left: '-100%'}} animate={{left: '0%'}} transition={{duration: 2.3}} />
                            </div>
                        </div>
                    </div>
                );
            }

            if (!driver) {
                return (
                    <div className="fixed inset-0 bg-[#0d0d0d] flex items-center justify-center p-6 bg-[radial-gradient(circle_at_center,_#111_0%,_#000_100%)]">
                        <div className="w-full max-w-sm bg-[#161616] p-8 rounded-[3rem] border border-[#222] shadow-2xl">
                             <h1 className="text-center font-black text-emerald-500 text-xl tracking-tighter mb-8 italic">SYNERGY OCC</h1>
                             <label className="text-[10px] font-black text-gray-600 uppercase mb-3 block px-1">Identifikátor řidiče</label>
                             <input 
                                id="d-in" type="text" placeholder="Jméno nebo služební číslo"
                                className="w-full bg-[#111] p-5 rounded-2xl mb-4 border border-[#333] outline-none font-bold text-white focus:border-emerald-500"
                                onKeyDown={e => e.key === 'Enter' && handleDriverLogin(e.target.value)}
                             />
                             <button onClick={() => handleDriverLogin(document.getElementById('d-in').value)} className="w-full bg-emerald-600 py-5 rounded-2xl font-black shadow-lg">PŘIHLÁSIT SE</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="fixed inset-0 flex flex-col overflow-hidden bg-[#0d0d0d]">
                    <header className="h-14 bg-[#1a1a1a] border-b border-[#222] flex items-center justify-between px-3 flex-shrink-0 z-50">
                        <div className="flex items-center gap-2">
                            <div className="bg-emerald-600 px-2 py-1 rounded font-black text-lg">{config.lineNumber}</div>
                            <div className="flex flex-col">
                                <span className="text-[7px] text-gray-500 font-bold">ŘID: {driver.name.toUpperCase()}</span>
                                <span className="text-xs font-bold truncate max-w-[120px]">{config.destination}</span>
                            </div>
                        </div>
                        <div className="text-lg font-mono font-black text-emerald-500">
                            {currentTime.toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' })}
                        </div>
                        <button onClick={() => { setTempConfig(config); setShowSettings(true); }} className="w-10 h-10 rounded-xl bg-[#222] flex items-center justify-center text-gray-400">
                            <i data-lucide="settings" style={{width: 18}}></i>
                        </button>
                    </header>

                    <div className="bg-black/60 px-3 py-2 border-b border-[#222] flex items-center justify-between text-xs font-bold text-emerald-400">
                        <div className="flex items-center gap-3">
                            <button onClick={playAnnouncement} className="w-8 h-8 bg-emerald-500/10 rounded-full flex items-center justify-center pulse-active">
                                <i data-lucide="volume-2" style={{width: 14}}></i>
                            </button>
                            <div className="flex flex-col">
                                <span className="text-[7px] text-gray-600 uppercase">Aktuální stanice</span>
                                <span className="truncate">{config.stops[currentStopIndex]}</span>
                            </div>
                        </div>
                        <button onClick={nextStop} className="bg-emerald-600 text-white px-3 py-2.5 rounded-lg text-[10px] font-black">ODJEZD</button>
                    </div>

                    <main className="flex-1 flex overflow-hidden">
                        <section className="flex-1 p-2 overflow-y-auto custom-scrollbar pb-24">
                            <div className="grid grid-cols-2 gap-2">
                                {TICKETS.map(t => (
                                    <button onClick={() => addToCart(t)} key={t.id} className={`${t.color} p-3 rounded-2xl h-24 text-left flex flex-col justify-between border border-white/5 active:scale-95 transition-transform`}>
                                        <div className="font-bold text-xs leading-tight">{t.name}</div>
                                        <div className="text-right text-xl font-black">{t.price} <small className="text-[10px] font-normal opacity-70">Kč</small></div>
                                    </button>
                                ))}
                            </div>
                        </section>
                    </main>

                    <footer className="md:hidden h-16 bg-[#1a1a1a] border-t border-[#222] flex items-center px-3 gap-2 flex-shrink-0">
                        <button onClick={() => setShowMobileCart(true)} className="flex-1 bg-emerald-600 h-12 rounded-2xl flex items-center justify-center font-black relative">
                            KOŠÍK {cart.length > 0 && <span className="ml-2 bg-white text-emerald-600 w-5 h-5 rounded-full text-[10px] flex items-center justify-center">{cart.length}</span>}
                        </button>
                        <div className="bg-[#222] h-12 px-4 rounded-xl flex items-center font-black text-emerald-500 border border-[#333]">{total} Kč</div>
                    </footer>

                    {showMobileCart && (
                        <div className="fixed inset-0 bg-black/95 z-[100] flex flex-col pt-4">
                            <div className="p-4 border-b border-[#222] flex justify-between"><span className="font-black">DETAIL NÁKUPU</span><button onClick={() => setShowMobileCart(false)} className="bg-[#333] w-10 h-10 rounded-xl">X</button></div>
                            <div className="flex-1 p-4 space-y-3 overflow-y-auto">
                                {cart.map(item => (
                                    <div key={item.id} className="bg-[#1a1a1a] p-4 rounded-2xl flex justify-between border border-[#222]">
                                        <div><div className="font-bold text-xs">{item.name}</div><div className="text-emerald-500 font-black">{item.quantity}x</div></div>
                                        <div className="font-black text-xl">{item.price * item.quantity} Kč</div>
                                    </div>
                                ))}
                            </div>
                            <div className="p-6 bg-[#111] border-t border-[#222] rounded-t-[3rem]">
                                <div className="flex justify-between mb-4"><span className="font-bold text-gray-500">CELKEM</span><span className="text-4xl font-black text-emerald-500">{total} Kč</span></div>
                                <button onClick={handlePayment} className="w-full bg-emerald-600 py-5 rounded-2xl font-black">ZAPLATIT HOTOVĚ / KARTOU</button>
                            </div>
                        </div>
                    )}

                    {showSettings && (
                        <div className="fixed inset-0 bg-black/98 z-[110] flex items-center justify-center p-4">
                            <div className="bg-[#1a1a1a] w-full max-w-sm rounded-[2.5rem] border border-[#333] h-[85vh] flex flex-col">
                                <div className="p-6 border-b border-[#333] flex justify-between items-center text-[10px] font-black uppercase text-gray-500">Nastavení <button onClick={() => setShowSettings(false)}>X</button></div>
                                <div className="p-6 space-y-5 overflow-y-auto flex-1">
                                    <div className="bg-red-500/10 p-4 rounded-2xl flex items-center justify-between">
                                        <div><p className="text-[10px] font-black text-red-500 uppercase">Power System</p><p className="text-[8px] text-gray-600 uppercase">Směna bude ukončena</p></div>
                                        <button onClick={() => { setIsPoweredOn(false); setDriver(null); }} className="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center"><i data-lucide="power" size="18"></i></button>
                                    </div>
                                    <div><label className="text-[9px] text-gray-500 block mb-1">ČÍSLO LINKY</label><input className="w-full bg-[#222] p-4 rounded-2xl font-black text-emerald-500 outline-none" value={tempConfig.lineNumber} onChange={e => setTempConfig({...tempConfig, lineNumber: e.target.value})} /></div>
                                    <div><label className="text-[9px] text-gray-500 block mb-1">CÍL</label><input className="w-full bg-[#222] p-4 rounded-2xl font-bold outline-none" value={tempConfig.destination} onChange={e => setTempConfig({...tempConfig, destination: e.target.value})} /></div>
                                    <div><label className="text-[9px] text-gray-500 block mb-1">ZASTÁVKY (KAŽDÁ NA NOVÝ ŘÁDEK)</label><textarea className="w-full bg-[#222] p-4 rounded-2xl text-[10px] outline-none h-40 leading-relaxed" value={tempConfig.stops.join('\n')} onChange={e => setTempConfig({...tempConfig, stops: e.target.value.split('\n').map(s=>s.trim()).filter(Boolean)})} /></div>
                                </div>
                                <div className="p-4"><button onClick={() => { setConfig(tempConfig); setShowSettings(false); setCurrentStopIndex(0); }} className="w-full bg-emerald-600 py-4 rounded-2xl font-black uppercase text-xs">Uložit nákres linky</button></div>
                            </div>
                        </div>
                    )}

                    {isPaying && <div className="fixed inset-0 bg-black/90 z-[200] flex items-center justify-center font-black animate-pulse text-emerald-500">PLATBA...</div>}
                    {paymentSuccess && <div className="fixed top-0 left-0 right-0 bg-emerald-500 z-[210] p-5 text-center font-black text-sm">TISKU JÍZDENKU</div>}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        setInterval(() => window.lucide && lucide.createIcons(), 1000);
    </script>
</body>
</html>
