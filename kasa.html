<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Synergy OCC - Mobilní Pokladna</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React a Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide ikony -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            touch-action: manipulation;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        /* Animace pro hlášení */
        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .pulse-active { animation: pulse-green 2s infinite; }
    </style>
</head>
<body class="bg-[#0a0a0a] text-white overflow-hidden select-none">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        const TICKETS = [
            { id: '1', name: 'Základní 30 min', price: 30, category: 'base', color: 'bg-emerald-600' },
            { id: '2', name: 'Základní 60 min', price: 40, category: 'base', color: 'bg-emerald-600' },
            { id: '3', name: 'Základní 90 min', price: 50, category: 'base', color: 'bg-emerald-600' },
            { id: '4', name: 'Zlevněná 30 min', price: 15, category: 'discount', color: 'bg-amber-600' },
            { id: '5', name: 'Zlevněná 60 min', price: 20, category: 'discount', color: 'bg-amber-600' },
            { id: '6', name: 'Zlevněná 90 min', price: 25, category: 'discount', color: 'bg-amber-600' },
            { id: '7', name: 'Senior / ZTP', price: 0, category: 'discount', color: 'bg-amber-600' },
            { id: '8', name: 'Zavazadlo', price: 20, category: 'special', color: 'bg-sky-600' },
            { id: '9', name: 'Pes', price: 20, category: 'special', color: 'bg-sky-600' },
            { id: '10', name: 'Přestupní denní', price: 120, category: 'base', color: 'bg-indigo-600' },
        ];

        function App() {
            const [config, setConfig] = useState(() => {
                const saved = localStorage.getItem('synergy_config');
                return saved ? JSON.parse(saved) : {
                    lineNumber: '12',
                    destination: 'Technologický park',
                    stops: ['Hlavní nádraží', 'Náměstí Svobody (z)', 'Zelný trh', 'Česká', 'Technologický park']
                };
            });

            const [cart, setCart] = useState([]);
            const [currentTime, setCurrentTime] = useState(new Date());
            const [currentStopIndex, setCurrentStopIndex] = useState(0);
            const [isPaying, setIsPaying] = useState(false);
            const [paymentSuccess, setPaymentSuccess] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [showMobileCart, setShowMobileCart] = useState(false);
            const [tempConfig, setTempConfig] = useState(config);

            const playPaymentSound = () => {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(); osc.stop(ctx.currentTime + 0.2);
                } catch (e) {}
            };

            const playAnnouncement = useCallback(() => {
                const stops = config.stops;
                const current = stops[currentStopIndex] || '';
                const next = stops[(currentStopIndex + 1) % stops.length] || '';
                
                const isReq = (s) => s.toLowerCase().includes('(z)') || s.toLowerCase().includes('na znamení');
                
                let text = `Zastávka: ${current.replace(/\(z\)/gi, '')}.`;
                if (isReq(current)) text += " Tato zastávka je na znamení.";
                
                text += ` Příští zastávka: ${next.replace(/\(z\)/gi, '')}.`;
                if (isReq(next)) text += " Příští zastávka bude na znamení.";
                
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'cs-CZ';
                msg.pitch = 0.82; // Mužský tón
                msg.rate = 0.9;
                
                const voices = window.speechSynthesis.getVoices();
                const v = voices.find(v => v.lang.includes('cs') && (v.name.toLowerCase().includes('jakub') || v.name.toLowerCase().includes('matej') || v.name.toLowerCase().includes('male')));
                if (v) msg.voice = v;
                
                window.speechSynthesis.speak(msg);
            }, [config.stops, currentStopIndex]);

            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                localStorage.setItem('synergy_config', JSON.stringify(config));
                if (window.lucide) lucide.createIcons();
            }, [config, showSettings, showMobileCart]);

            const addToCart = (ticket) => {
                setCart(prev => {
                    const existing = prev.find(item => item.id === ticket.id);
                    if (existing) {
                        return prev.map(item => item.id === ticket.id ? { ...item, quantity: item.quantity + 1 } : item);
                    }
                    return [...prev, { ...ticket, quantity: 1 }];
                });
            };

            const removeFromCart = (id) => {
                setCart(prev => prev.map(item => {
                    if (item.id === id) return item.quantity > 1 ? { ...item, quantity: item.quantity - 1 } : null;
                    return item;
                }).filter(Boolean));
            };

            const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

            const handlePayment = () => {
                setIsPaying(true);
                setTimeout(() => {
                    setIsPaying(false);
                    setPaymentSuccess(true);
                    playPaymentSound();
                    setTimeout(() => {
                        setPaymentSuccess(false);
                        setCart([]);
                        setShowMobileCart(false);
                    }, 2000);
                }, 1200);
            };

            return (
                <div className="fixed inset-0 flex flex-col overflow-hidden bg-[#0d0d0d]">
                    {/* Header */}
                    <header className="h-14 bg-[#1a1a1a] border-b border-[#333] flex items-center justify-between px-3 flex-shrink-0 z-50 shadow-lg">
                        <div className="flex items-center gap-2">
                            <div className="bg-emerald-600 px-2 py-1 rounded font-black text-lg shadow-[0_0_10px_rgba(16,185,129,0.3)]">{config.lineNumber}</div>
                            <div className="flex flex-col">
                                <span className="text-[8px] uppercase text-gray-500 font-bold">SMĚR</span>
                                <span className="text-xs font-bold truncate max-w-[100px] leading-tight">{config.destination}</span>
                            </div>
                        </div>
                        <div className="text-lg font-mono font-black text-emerald-500">
                            {currentTime.toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' })}
                        </div>
                        <button onClick={() => { setTempConfig(config); setShowSettings(true); }} className="w-9 h-9 rounded-xl bg-[#222] border border-[#333] flex items-center justify-center text-gray-400 active:bg-emerald-600 active:text-white transition-colors">
                            <i data-lucide="settings" style={{width: 18}}></i>
                        </button>
                    </header>

                    {/* Zastávka Bar */}
                    <div className="bg-black/60 px-3 py-2 border-b border-[#222] flex items-center justify-between text-xs font-bold text-emerald-400">
                        <div className="flex items-center gap-3 overflow-hidden">
                            <button onClick={playAnnouncement} className="w-8 h-8 bg-emerald-500/10 rounded-full flex items-center justify-center pulse-active flex-shrink-0">
                                <i data-lucide="volume-2" style={{width: 14}}></i>
                            </button>
                            <div className="flex flex-col overflow-hidden">
                                <span className="text-[7px] text-gray-600 uppercase font-black">Aktuální stanice</span>
                                <span className="truncate">{config.stops[currentStopIndex]}</span>
                            </div>
                        </div>
                        <button onClick={() => setCurrentStopIndex((currentStopIndex + 1) % config.stops.length)} className="bg-emerald-500/20 text-emerald-500 px-3 py-2 rounded-lg text-[10px] active:scale-95 transition-transform uppercase font-black">DALŠÍ</button>
                    </div>

                    {/* Main Grid */}
                    <main className="flex-1 flex overflow-hidden">
                        {/* Tickets List */}
                        <section className="flex-1 p-2 overflow-y-auto custom-scrollbar pb-24">
                            <div className="grid grid-cols-2 gap-2">
                                {TICKETS.map(t => (
                                    <button 
                                        key={t.id} 
                                        onClick={() => addToCart(t)}
                                        className={`${t.color} p-3 rounded-2xl h-24 text-left flex flex-col justify-between border border-white/5 shadow-lg active:scale-95 transition-transform relative overflow-hidden group`}
                                    >
                                        <div className="font-bold text-xs leading-tight drop-shadow-md">{t.name}</div>
                                        <div className="text-right text-xl font-black drop-shadow-lg">{t.price} <small className="text-[10px] font-normal opacity-70">Kč</small></div>
                                        <div className="absolute top-1 right-2 opacity-10"><i data-lucide="ticket" style={{width: 32}}></i></div>
                                    </button>
                                ))}
                            </div>
                        </section>

                        {/* Desktop Cart Sidebar */}
                        <aside className="hidden md:flex w-80 bg-[#161616] border-l border-[#222] flex-col shadow-2xl">
                            <div className="p-4 font-black border-b border-[#222] text-[10px] tracking-widest text-gray-500 uppercase">Nákupní seznam</div>
                            <div className="flex-1 overflow-y-auto p-3 space-y-2 custom-scrollbar">
                                {cart.map(item => (
                                    <div key={item.id} className="bg-[#1f1f1f] p-3 rounded-xl border border-[#222] flex justify-between items-center text-xs">
                                        <div><div className="font-bold">{item.name}</div><div className="text-emerald-500 font-black">{item.quantity}x <span className="text-gray-600 text-[10px]">({item.price} Kč)</span></div></div>
                                        <div className="font-black text-sm">{item.price * item.quantity} Kč</div>
                                    </div>
                                ))}
                            </div>
                            <div className="p-4 bg-black/40 border-t border-[#222] space-y-4">
                                <div className="flex justify-between items-end"><span className="text-[10px] font-black text-gray-600 uppercase">CELKEM K ÚHRADĚ</span> <span className="text-3xl font-black text-emerald-500">{total} Kč</span></div>
                                <div className="grid grid-cols-2 gap-2">
                                   <button disabled={cart.length === 0} onClick={handlePayment} className="bg-[#222] border border-[#333] p-3 rounded-xl flex flex-col items-center gap-1 font-black text-[9px] hover:bg-emerald-600 transition-colors">
                                       <i data-lucide="banknote" style={{width: 18}}></i>HOTOVOST
                                   </button>
                                   <button disabled={cart.length === 0} onClick={handlePayment} className="bg-[#222] border border-[#333] p-3 rounded-xl flex flex-col items-center gap-1 font-black text-[9px] hover:bg-sky-600 transition-colors">
                                       <i data-lucide="credit-card" style={{width: 18}}></i>KARTA
                                   </button>
                                </div>
                            </div>
                        </aside>
                    </main>

                    {/* Mobile Cart Button */}
                    <footer className="md:hidden h-16 bg-[#1a1a1a] border-t border-[#222] flex items-center px-3 gap-2 flex-shrink-0 shadow-2xl">
                        <button onClick={() => setShowMobileCart(true)} className="flex-1 bg-emerald-600 h-12 rounded-2xl flex items-center justify-center font-black gap-2 relative active:scale-95 transition-all shadow-[0_0_20px_rgba(16,185,129,0.4)]">
                            <i data-lucide="shopping-cart" style={{width: 18}}></i>
                            KOŠÍK
                            {cart.length > 0 && <span className="absolute -top-1 -right-1 bg-white text-emerald-600 w-6 h-6 rounded-full text-[12px] flex items-center justify-center border-2 border-emerald-600">{cart.reduce((a,b) => a+b.quantity, 0)}</span>}
                        </button>
                        <div className="bg-[#222] h-12 px-4 rounded-2xl flex items-center font-black text-emerald-500 border border-[#333] min-w-[80px] justify-center">{total} Kč</div>
                    </footer>

                    {/* Mobile Cart Modal Overlay */}
                    {showMobileCart && (
                        <div className="md:hidden fixed inset-0 bg-black/95 z-[100] flex flex-col animate-in slide-in-from-bottom duration-300">
                            <div className="p-4 border-b border-[#222] flex justify-between items-center bg-[#1a1a1a]">
                                <span className="font-black tracking-widest text-emerald-500 text-sm">PODROBNOSTI NÁKUPU</span>
                                <button onClick={() => setShowMobileCart(false)} className="bg-[#333] w-10 h-10 rounded-xl flex items-center justify-center">X</button>
                            </div>
                            <div className="flex-1 overflow-y-auto p-4 space-y-3">
                                {cart.map(item => (
                                    <div key={item.id} className="bg-[#1a1a1a] p-4 rounded-2xl flex justify-between items-center border border-[#333]">
                                        <div><div className="font-bold text-sm">{item.name}</div><div className="text-emerald-500 font-black text-lg">{item.quantity}x</div></div>
                                        <div className="font-black text-xl">{item.price * item.quantity} Kč</div>
                                    </div>
                                ))}
                            </div>
                            <div className="p-6 bg-[#1a1a1a] border-t border-[#333] rounded-t-3xl shadow-2xl">
                                <div className="flex justify-between items-center mb-6"><span className="font-black text-gray-500 uppercase text-xs">CELKEM</span><span className="text-4xl font-black text-emerald-500">{total} Kč</span></div>
                                <div className="grid grid-cols-2 gap-3">
                                    <button onClick={handlePayment} className="bg-[#222] border border-[#333] p-5 rounded-2xl flex flex-col items-center gap-2 font-black text-[10px]"><i data-lucide="banknote"></i>HOTOVOST</button>
                                    <button onClick={handlePayment} className="bg-[#222] border border-[#333] p-5 rounded-2xl flex flex-col items-center gap-2 font-black text-[10px]"><i data-lucide="credit-card"></i>KARTA</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Settings Modal */}
                    {showSettings && (
                        <div className="fixed inset-0 bg-black/95 z-[110] flex items-center justify-center p-4">
                            <div className="bg-[#1a1a1a] w-full max-w-sm rounded-3xl border border-[#333] overflow-hidden flex flex-col shadow-2xl">
                                <div className="p-5 border-b border-[#333] flex justify-between items-center font-black text-xs uppercase tracking-widest text-gray-500">Konfigurace kasy <button onClick={() => setShowSettings(false)} className="w-8 h-8 rounded-full bg-[#222] flex items-center justify-center">X</button></div>
                                <div className="p-6 space-y-5 flex-1 overflow-y-auto custom-scrollbar">
                                    <div><label className="text-[9px] text-gray-500 font-black block mb-1">ČÍSLO LINKY</label><input className="w-full bg-[#222] p-4 rounded-2xl font-black text-emerald-500 border border-[#333] outline-none" value={tempConfig.lineNumber} onChange={e => setTempConfig({...tempConfig, lineNumber: e.target.value})} /></div>
                                    <div><label className="text-[9px] text-gray-500 font-black block mb-1">CÍLOVÁ STANICE</label><input className="w-full bg-[#222] p-4 rounded-2xl font-bold border border-[#333] outline-none" value={tempConfig.destination} onChange={e => setTempConfig({...tempConfig, destination: e.target.value})} /></div>
                                    <div>
                                        <label className="text-[9px] text-gray-500 font-black block mb-1">ZASTÁVKY (KAŽDÁ NA NOVÝ ŘÁDEK)</label>
                                        <textarea className="w-full bg-[#222] p-4 rounded-2xl text-[11px] font-medium border border-[#333] outline-none h-40 leading-relaxed custom-scrollbar" value={tempConfig.stops.join('\n')} onChange={e => setTempConfig({...tempConfig, stops: e.target.value.split('\n').map(s => s.trim()).filter(Boolean)})} placeholder="Např:&#10;Hlavní nádraží&#10;Česká (z)" />
                                        <p className="text-[8px] text-gray-600 mt-2 italic font-medium px-1">* Pro zastávku na znamení dopiš (z) k názvu.</p>
                                    </div>
                                </div>
                                <div className="p-4 bg-black/20">
                                    <button onClick={() => { setConfig(tempConfig); setShowSettings(false); setCurrentStopIndex(0); }} className="w-full bg-emerald-600 py-4 rounded-2xl font-black uppercase text-xs shadow-xl active:scale-95 transition-transform">Uložit a nahrát line-up</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Status Overlays */}
                    {isPaying && <div className="fixed inset-0 bg-black/90 z-[200] flex flex-col items-center justify-center font-black animate-pulse gap-4 text-emerald-500"><i data-lucide="loader-2" class="animate-spin" size="48"></i><span className="tracking-widest">PROBÍHÁ AUTORIZACE...</span></div>}
                    {paymentSuccess && <div className="fixed top-0 left-0 right-0 bg-emerald-500 z-[210] p-5 text-center font-black text-sm shadow-2xl flex items-center justify-center gap-3 animate-in slide-in-from-top"><i data-lucide="check-circle-2"></i>PLATBA ÚSPĚŠNÁ - TISKNU JÍZDENKU</div>}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // Refresh icons periodically to handle React re-renders
        setInterval(() => { if (window.lucide) lucide.createIcons(); }, 1000);
    </script>
</body>
</html>
